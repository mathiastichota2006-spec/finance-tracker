<!DOCTYPE html>
<html lang="cs-CZ">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanční Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-actions">
                <button id="exportBtn" class="action-btn" title="Exportovat data">
                    <span>💾</span> Export
                </button>
                <button id="importBtn" class="action-btn" title="Importovat data">
                    <span>📂</span> Import
                </button>
                <input type="file" id="importFile" accept=".json" style="display: none;">
                <button id="themeToggle" class="theme-toggle" title="Přepnout motiv">
                    <span class="theme-icon">🌙</span>
                </button>
            </div>
            <div class="header-top">
                <h1>Finanční Tracker</h1>
            </div>
            <div class="month-selector">
                <span id="currentMonth" class="current-month"></span>
                <div class="month-nav">
                    <button id="prevMonth" class="month-btn">← Předchozí</button>
                    <button id="nextMonth" class="month-btn">Další →</button>
                </div>
            </div>
        </header>

        <main>
            <!-- Add/Edit Entry Form -->
            <section class="add-entry-section">
                <h2 id="formTitle">Přidat položku</h2>
                <div class="form-group">
                    <label for="entryDate">Datum:</label>
                    <input type="date" id="entryDate" required>
                </div>
                <div class="form-group">
                    <label for="entryTime">Čas:</label>
                    <input type="time" id="entryTime" required>
                </div>
                <div class="form-group">
                    <label for="entryDescription">Popis:</label>
                    <input type="text" id="entryDescription" placeholder="např. Nákup potravin" required>
                </div>
                <div class="form-group">
                    <label for="entryType">Typ:</label>
                    <select id="entryType" required>
                        <option value="">-- Vyberte typ --</option>
                        <option value="Doprava">Doprava</option>
                        <option value="Elektronika">Elektronika</option>
                        <option value="Hry">Hry</option>
                        <option value="Nákupy">Nákupy</option>
                        <option value="Online nákupy">Online nákupy</option>
                        <option value="Palivo">Palivo</option>
                        <option value="Předplatné">Předplatné</option>
                        <option value="Restaurace & Fast Food">Restaurace & Fast Food</option>
                        <option value="Tabák">Tabák</option>
                        <option value="Pravidelný příjem">Pravidelný příjem</option>
                        <option value="Nepravidelný příjem">Nepravidelný příjem</option>
                        <option value="Počáteční zůstatek">Počáteční zůstatek</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="entryAmount">Částka:</label>
                    <input type="number" id="entryAmount" step="0.01" placeholder="0.00" required>
                </div>
                <div class="form-buttons">
                    <button id="addEntryBtn" class="btn-primary">Přidat</button>
                    <button id="cancelEditBtn" class="btn-cancel" style="display: none;">Zrušit</button>
                </div>
            </section>

            <!-- Summary Section -->
            <section class="summary-section">
                <h2>Přehled</h2>
                <div class="summary-grid">
                    <div class="summary-card">
                        <span class="summary-label">Počáteční zůstatek:</span>
                        <span id="startingBalance" class="summary-value">0.00 Kč</span>
                    </div>
                    <div class="summary-card">
                        <span class="summary-label">Celkové příjmy:</span>
                        <span id="totalIncome" class="summary-value income">0.00 Kč</span>
                    </div>
                    <div class="summary-card">
                        <span class="summary-label">Celkové výdaje:</span>
                        <span id="totalExpenses" class="summary-value expense">0.00 Kč</span>
                    </div>
                    <div class="summary-card">
                        <span class="summary-label">Aktuální zůstatek:</span>
                        <span id="currentBalance" class="summary-value">0.00 Kč</span>
                    </div>
                </div>
            </section>

            <!-- Income Category Breakdown -->
            <section class="category-section">
                <h2>Příjmy podle kategorií</h2>
                <div id="incomeCategoryBreakdown" class="category-list"></div>
            </section>

            <!-- Expense Category Breakdown -->
            <section class="category-section">
                <h2>Výdaje podle kategorií</h2>
                <div id="categoryBreakdown" class="category-list"></div>
            </section>

            <!-- Entries Log -->
            <section class="entries-section">
                <h2>Položky</h2>
                <div id="entriesList" class="entries-list"></div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
